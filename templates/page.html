{% extends "base.html" %}

{% block ogdata %}
<meta property="og:title" content="{{ page.title }}" />
<meta property="og:type" content="article" />
<meta property="og:url" content="/{{ page.slug }}" />
<meta property="og:description" content="{{ page.description }}" />
{% endblock ogdata %}

{% block content %}
{{ page.content | safe }}
{% endblock content %}
